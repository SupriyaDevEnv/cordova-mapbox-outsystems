name: Build Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - test/android-apk-harness

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install Cordova CLI
        run: npm install -g cordova@13.0.0

      - name: Create test application
        run: |
          APP_DIR="$RUNNER_TEMP/realm-mapbox-test"
          rm -rf "$APP_DIR"
          cordova create "$APP_DIR" com.realmmapping.mapboxtest 'Realm Mapping Mapbox Test'
          rm -rf "$APP_DIR/www"
          cp -R "$GITHUB_WORKSPACE/test-app/www" "$APP_DIR/www"

      - name: Add Android platform and current plugin
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          APP_DIR="$RUNNER_TEMP/realm-mapbox-test"
          cd "$APP_DIR"
          cordova platform add android@15.0.0
          TOKEN="${MAPBOX_ACCESS_TOKEN:-pk.test-harness}"
          cordova plugin add "$GITHUB_WORKSPACE" --variable MAPBOX_ACCESS_TOKEN="$TOKEN"
          cordova prepare android

      - name: Build debug APK
        run: |
          APP_DIR="$RUNNER_TEMP/realm-mapbox-test"
          cd "$APP_DIR"
          cordova build android --debug --verbose

      - name: Collect APK
        run: |
          APP_DIR="$RUNNER_TEMP/realm-mapbox-test"
          mkdir -p apk-output
          cp "$APP_DIR/platforms/android/app/build/outputs/apk/debug/app-debug.apk" \
            apk-output/realm-mapping-mapbox-test.apk
          sha256sum apk-output/realm-mapping-mapbox-test.apk > apk-output/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: realm-mapping-mapbox-test-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 14
